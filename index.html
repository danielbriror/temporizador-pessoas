<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controle de Tempo por Pessoa</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            
            --color-green-bg: #065f46;
            --color-green-hover: #047857;
            --color-green-border: #10b981;
            
            --color-yellow-bg: #854d0e;
            --color-yellow-hover: #a16207;
            --color-yellow-border: #f59e0b;
            
            --color-red-bg: #991b1b;
            --color-red-hover: #b91c1c;
            --color-red-border: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            text-align: center;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.3;
        }

        .form-add {
            display: flex;
            gap: 8px;
            background-color: var(--card-bg);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .input-name {
            flex: 1;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        .input-name:focus {
            border-color: var(--color-green-border);
        }

        .btn-add {
            padding: 12px 18px;
            border-radius: 8px;
            border: none;
            background-color: #2563eb;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        .btn-add:active {
            background-color: #1d4ed8;
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .person-item {
            width: 100%;
            display: flex;
            position: relative;
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .main-btn {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            padding: 16px 50px 16px 16px;
            border: none;
            cursor: pointer;
            text-align: left;
            transition: background-color 0.2s, transform 0.1s;
            color: #ffffff;
            min-height: 88px;
        }

        .main-btn:active {
            transform: scale(0.99);
        }

        /* Estados de Cores */
        .state-green {
            background-color: var(--color-green-bg);
            border-left: 6px solid var(--color-green-border);
        }

        .state-green:hover {
            background-color: var(--color-green-hover);
        }

        .state-yellow {
            background-color: var(--color-yellow-bg);
            border-left: 6px solid var(--color-yellow-border);
        }

        .state-yellow:hover {
            background-color: var(--color-yellow-hover);
        }

        .state-red {
            background-color: var(--color-red-bg);
            border-left: 6px solid var(--color-red-border);
        }

        .state-red:hover {
            background-color: var(--color-red-hover);
        }

        .person-name {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 4px;
            word-break: break-word;
        }

        .status-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            opacity: 0.95;
            font-weight: 500;
        }

        .timer-badge {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 1.05rem;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 8px;
            border-radius: 6px;
            letter-spacing: 0.5px;
        }

        .btn-delete {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.6);
        }

        .empty-state {
            text-align: center;
            padding: 32px 16px;
            color: var(--text-muted);
            font-size: 0.95rem;
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px dashed var(--border-color);
        }

        .footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            margin-top: 8px;
        }

        .btn-clear-all {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .btn-clear-all:hover {
            color: #ef4444;
            border-color: #ef4444;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Controle de Tempo por Pessoa</h1>
        <p class="subtitle">
            Verde (5 min rodando) &rarr; Amarelo ao acabar<br>
            Amarelo (30 min rodando) &rarr; Vermelho ao acabar
        </p>
    </header>

    <div class="form-add">
        <input type="text" id="personNameInput" class="input-name" placeholder="Nome da pessoa (opcional)" maxlength="40" autocomplete="off">
        <button id="btnAdd" class="btn-add">Adicionar</button>
    </div>

    <div id="listContainer" class="list-container">
        <!-- Itens inseridos via JavaScript -->
    </div>

    <div class="footer-bar">
        <span id="counterText">0 pessoas registradas</span>
        <button id="btnClearAll" class="btn-clear-all">Limpar Tudo</button>
    </div>
</div>

<script>
    // Gerenciador de Áudio com Sintetizador Nativo (Web Audio API)
    function playBeep() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.6);
        } catch (e) {
            console.log('Audio Context bloqueado ou não suportado');
        }
    }

    const STORAGE_KEY = 'timer_people_app_v2';
    let people = [];
    let counterAutoName = 1;

    /*
      Estados possíveis por pessoa (stage):
      - 'green_idle': Inicial (Verde). Ao clicar -> inicia 5 min (green_running).
      - 'green_running': Rodando 5 min (Fica Verde). Ao acabar o tempo -> fica Amarelo (yellow_idle).
      - 'yellow_idle': Esperando clique para 30 min (Amarelo). Ao clicar -> inicia 30 min (yellow_running).
      - 'yellow_running': Rodando 30 min (Fica Amarelo). Ao acabar o tempo -> fica Vermelho (red_finished).
      - 'red_finished': Finalizado (Vermelho). Ao clicar -> reinicia para Verde (green_idle).
    */

    function loadData() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                people = JSON.parse(saved);
                const maxId = people.reduce((max, p) => {
                    const num = parseInt(p.name.replace(/\D/g, ''), 10);
                    return !isNaN(num) && num > max ? num : max;
                }, 0);
                counterAutoName = maxId + 1;
            } catch (e) {
                people = [];
            }
        }
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(people));
    }

    function addPerson(name) {
        const trimmedName = name.trim();
        const finalName = trimmedName.length > 0 ? trimmedName : `Pessoa ${counterAutoName++}`;

        const newPerson = {
            id: 'p_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
            name: finalName,
            stage: 'green_idle',
            timerEnd: null
        };

        people.unshift(newPerson);
        saveData();
        render();
    }

    function deletePerson(id, event) {
        event.stopPropagation();
        people = people.filter(p => p.id !== id);
        saveData();
        render();
    }

    function handleButtonClick(id) {
        const person = people.find(p => p.id === id);
        if (!person) return;

        const now = Date.now();

        if (person.stage === 'green_idle') {
            // Clique no verde -> Inicia timer de 5 min (continua verde até o tempo acabar)
            person.stage = 'green_running';
            person.timerEnd = now + (5 * 60 * 1000);
        } else if (person.stage === 'green_running') {
            // Se clicar enquanto o timer de 5 min está rodando, avança manualmente para Amarelo
            person.stage = 'yellow_idle';
            person.timerEnd = null;
        } else if (person.stage === 'yellow_idle') {
            // Clique no amarelo -> Inicia timer de 30 min (continua amarelo até o tempo acabar)
            person.stage = 'yellow_running';
            person.timerEnd = now + (30 * 60 * 1000);
        } else if (person.stage === 'yellow_running') {
            // Se clicar enquanto o timer de 30 min está rodando, avança manualmente para Vermelho
            person.stage = 'red_finished';
            person.timerEnd = null;
        } else if (person.stage === 'red_finished') {
            // Clique no vermelho -> Reinicia o ciclo para verde
            person.stage = 'green_idle';
            person.timerEnd = null;
        }

        saveData();
        render();
    }

    function formatTime(secondsRemaining) {
        if (secondsRemaining <= 0) return '00:00';
        const mins = Math.floor(secondsRemaining / 60);
        const secs = secondsRemaining % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function updateLogicState() {
        const now = Date.now();
        let changed = false;

        people.forEach(person => {
            if (person.timerEnd && person.timerEnd > 0) {
                const remaining = Math.max(0, Math.ceil((person.timerEnd - now) / 1000));
                
                if (remaining === 0) {
                    playBeep();
                    if (person.stage === 'green_running') {
                        person.stage = 'yellow_idle';
                        person.timerEnd = null;
                        changed = true;
                    } else if (person.stage === 'yellow_running') {
                        person.stage = 'red_finished';
                        person.timerEnd = null;
                        changed = true;
                    }
                }
            }
        });

        if (changed) {
            saveData();
        }
    }

    function render() {
        updateLogicState();

        const listContainer = document.getElementById('listContainer');
        const counterText = document.getElementById('counterText');

        counterText.textContent = `${people.length} ${people.length === 1 ? 'pessoa registrada' : 'pessoas registradas'}`;

        if (people.length === 0) {
            listContainer.innerHTML = `
                <div class="empty-state">
                    Nenhuma pessoa adicionada.<br>Insira um nome acima ou toque em "Adicionar".
                </div>
            `;
            return;
        }

        const now = Date.now();
        let html = '';

        people.forEach(person => {
            let stateClass = '';
            let statusText = '';
            let timerHtml = '';

            if (person.stage === 'green_idle') {
                stateClass = 'state-green';
                statusText = 'Verde &bull; Toque para iniciar timer de 5 min';
            } else if (person.stage === 'green_running') {
                stateClass = 'state-green';
                const remainingSecs = Math.max(0, Math.ceil((person.timerEnd - now) / 1000));
                timerHtml = `<span class="timer-badge">${formatTime(remainingSecs)}</span>`;
                statusText = 'Verde (5 min rodando...)';
            } else if (person.stage === 'yellow_idle') {
                stateClass = 'state-yellow';
                statusText = 'Amarelo &bull; 5 min acabou! Toque p/ 30 min';
            } else if (person.stage === 'yellow_running') {
                stateClass = 'state-yellow';
                const remainingSecs = Math.max(0, Math.ceil((person.timerEnd - now) / 1000));
                timerHtml = `<span class="timer-badge">${formatTime(remainingSecs)}</span>`;
                statusText = 'Amarelo (30 min rodando...)';
            } else if (person.stage === 'red_finished') {
                stateClass = 'state-red';
                statusText = 'Vermelho &bull; 30 min acabou! (Toque p/ reiniciar)';
            }

            html += `
                <div class="person-item">
                    <button class="main-btn ${stateClass}" onclick="handleButtonClick('${person.id}')">
                        <div class="person-name">${escapeHtml(person.name)}</div>
                        <div class="status-info">
                            ${timerHtml}
                            <span>${statusText}</span>
                        </div>
                    </button>
                    <button class="btn-delete" title="Excluir" onclick="deletePerson('${person.id}', event)">&times;</button>
                </div>
            `;
        });

        listContainer.innerHTML = html;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Intervalo continuo de 1s para atualizar cronômetros e fazer transição
    setInterval(() => {
        render();
    }, 1000);

    // Listeners
    document.getElementById('btnAdd').addEventListener('click', () => {
        const input = document.getElementById('personNameInput');
        addPerson(input.value);
        input.value = '';
        input.focus();
    });

    document.getElementById('personNameInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const input = document.getElementById('personNameInput');
            addPerson(input.value);
            input.value = '';
        }
    });

    document.getElementById('btnClearAll').addEventListener('click', () => {
        if (people.length > 0 && confirm('Deseja realmente apagar todos os registros?')) {
            people = [];
            counterAutoName = 1;
            saveData();
            render();
        }
    });

    loadData();
    render();
</script>

</body>
</html>
